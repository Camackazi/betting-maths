      <stop offset="1" stop-color="#0a8f3c"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#06431e" flood-opacity=".28"/></filter>
