<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Klamic invoice advert</title>
  <desc id="desc">Bright blue Klamic banner promoting free professional UK invoices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f8f"/>
      <stop offset="0.48" stop-color="#0f55e8"/>
      <stop offset="1" stop-color="#12d9d0"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#12e4cf"/>
      <stop offset="1" stop-color="#39f4c1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#00144c" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <circle cx="1115" cy="72" r="190" fill="#42e8ff" opacity=".16"/>
  <circle cx="1015" cy="480" r="250" fill="#092ebd" opacity=".22"/>
  <path d="M20 438 C240 348 292 502 518 392 S906 330 1190 214" fill="none" stroke="#6cefff" stroke-width="38" opacity=".11"/>

  <g transform="translate(64 58)">
    <text x="0" y="72" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="86" font-weight="900" letter-spacing="3">KLAMIC</text>
    <rect x="0" y="92" width="104" height="7" rx="4" fill="#19efd6"/>
    <text x="0" y="164" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="800">Need an <tspan fill="#1bf1d1">invoice?</tspan></text>
    <text x="0" y="207" fill="#dce9ff" font-family="Arial, Helvetica, sans-serif" font-size="24">Create, preview and download a professional UK invoice for free.</text>
    <g transform="translate(0 238)">
      <circle cx="14" cy="14" r="14" fill="#19efd6"/>
      <path d="M7 14l5 5 9-11" fill="none" stroke="#07327e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="38" y="22" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">No sign-up required.</text>
    </g>
    <g transform="translate(0 296)">
      <rect width="390" height="76" rx="22" fill="url(#cta)" filter="url(#shadow)"/>
      <text x="34" y="50" fill="#062a6d" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">Create a free invoice →</text>
    </g>
    <g transform="translate(0 405)" font-family="Arial, Helvetica, sans-serif" font-weight="800">
      <text x="0" y="0" fill="#fff" font-size="18">100% FREE</text>
      <text x="138" y="0" fill="#fff" font-size="18">NO SIGN UP</text>
      <text x="302" y="0" fill="#fff" font-size="18">UK READY</text>
    </g>
  </g>

  <g transform="translate(765 52) rotate(2 180 190)" filter="url(#shadow)">
    <rect width="365" height="385" rx="24" fill="#fff"/>
    <text x="28" y="48" fill="#0b43cf" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="900">KLAMIC</text>
    <text x="272" y="44" fill="#0b43cf" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="900">INVOICE</text>
    <text x="28" y="85" fill="#314056" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">From</text>
    <text x="28" y="105" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">Your Business Ltd</text>
    <text x="218" y="85" fill="#314056" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">To</text>
    <text x="218" y="105" fill="#111827" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="800">Client Name</text>
    <rect x="210" y="130" width="125" height="72" rx="10" fill="#eaf1ff"/>
    <text x="226" y="151" fill="#0b43cf" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="800">TOTAL DUE</text>
    <text x="226" y="185" fill="#0b43cf" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="900">£750.00</text>
    <line x1="28" y1="226" x2="337" y2="226" stroke="#c9d7ee"/>
    <g fill="#dbe5f4">
      <rect x="28" y="247" width="250" height="10" rx="5"/>
      <rect x="28" y="272" width="210" height="10" rx="5"/>
      <rect x="28" y="297" width="275" height="10" rx="5"/>
    </g>
    <line x1="28" y1="330" x2="337" y2="330" stroke="#c9d7ee"/>
    <text x="216" y="360" fill="#0b43cf" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="800">TOTAL DUE</text>
    <text x="294" y="362" fill="#0b43cf" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="900">£750</text>
  </g>
  <text x="1090" y="474" fill="#eaffff" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="800" text-anchor="end">Advertisement</text>
</svg>