<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Better Darts</title>
  <desc id="desc">Mobile-safe Better Darts promotional banner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#04151b"/><stop offset=".62" stop-color="#06252a"/><stop offset="1" stop-color="#0a3a22"/></linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#d7ff00"/><stop offset="1" stop-color="#7edc00"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".28"/></filter>
  </defs>
  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <path d="M610 280L790 48l110 62v170z" fill="#8cff00" opacity=".12"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="34" y="84" fill="#fff" font-size="56" font-weight="900">BETTER</text>
    <text x="34" y="143" fill="url(#lime)" font-size="64" font-weight="900">DARTS</text>
    <text x="36" y="187" fill="#fff" font-size="28" font-weight="900">Score. <tspan fill="#28ded0">Train.</tspan> <tspan fill="#b9f500">Improve.</tspan></text>
    <g transform="translate(36 208)">
      <rect width="235" height="48" rx="16" fill="url(#lime)"/>
      <text x="117" y="32" text-anchor="middle" fill="#06211f" font-size="22" font-weight="900">Play smarter →</text>
    </g>
    <g transform="translate(667 42)" filter="url(#shadow)">
      <circle cx="88" cy="88" r="78" fill="#121819" stroke="#e5efe7" stroke-width="6"/>
      <circle cx="88" cy="88" r="61" fill="#f4e9cb" stroke="#202020" stroke-width="4"/>
      <circle cx="88" cy="88" r="42" fill="#181818" stroke="#f4e9cb" stroke-width="12" stroke-dasharray="18 14"/>
      <circle cx="88" cy="88" r="25" fill="#f4e9cb" stroke="#1d7b36" stroke-width="8"/>
      <circle cx="88" cy="88" r="8" fill="#e51d2a" stroke="#0d522a" stroke-width="5"/>
      <path d="M8 44L82 84" stroke="#10c8d7" stroke-width="10" stroke-linecap="round"/>
      <path d="M26 12L84 84" stroke="#b8f200" stroke-width="10" stroke-linecap="round"/>
    </g>
  </g>
</svg>