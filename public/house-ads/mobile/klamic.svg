<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Klamic free UK invoices</title>
  <desc id="desc">Mobile-safe Klamic banner promoting free UK invoices.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08289d"/><stop offset=".62" stop-color="#0a54df"/><stop offset="1" stop-color="#13d9d0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-opacity=".22"/></filter>
  </defs>
  <rect width="900" height="280" rx="24" fill="url(#bg)"/>
  <circle cx="820" cy="30" r="150" fill="#70f3ff" opacity=".12"/>
  <path d="M610 280c45-94 128-168 290-238v238z" fill="#031d87" opacity=".22"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="34" y="86" fill="#fff" font-size="72" font-weight="900" letter-spacing="2">KLAMIC</text>
    <text x="36" y="139" fill="#16efd8" font-size="38" font-weight="900">Free UK invoices</text>
    <text x="36" y="184" fill="#fff" font-size="26" font-weight="700">No sign-up • 100% free</text>
    <g transform="translate(36 207)">
      <rect width="250" height="48" rx="16" fill="#2af0cf"/>
      <text x="125" y="32" text-anchor="middle" fill="#062b71" font-size="22" font-weight="900">Create now →</text>
    </g>
    <g transform="translate(650 30) rotate(2 90 95)" filter="url(#shadow)">
      <rect width="180" height="190" rx="16" fill="#fff"/>
      <text x="16" y="34" fill="#1647c7" font-size="22" font-weight="900">INVOICE</text>
      <text x="16" y="68" fill="#334155" font-size="12">Bill To</text>
      <text x="16" y="88" fill="#111827" font-size="14" font-weight="700">Client Name</text>
      <rect x="16" y="108" width="148" height="9" rx="4" fill="#dbe6f7"/>
      <rect x="16" y="130" width="116" height="9" rx="4" fill="#dbe6f7"/>
      <rect x="16" y="152" width="136" height="9" rx="4" fill="#dbe6f7"/>
      <text x="16" y="181" fill="#1647c7" font-size="15" font-weight="900">TOTAL £500.00</text>
    </g>
  </g>
