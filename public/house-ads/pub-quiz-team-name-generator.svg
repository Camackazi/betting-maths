    <path d="M110 200h70l-12 70h-46z" fill="#fff5b5" stroke="#ff9e00" stroke-width="7"/>
    <path d="M126 100c15-20 47-20 62 0 16 21 9 48-10 61-15 10-20 19-20 29h-32c0-12-7-21-19-31-19-16-15-41-1-59z" fill="#fff" opacity=".88"/>
