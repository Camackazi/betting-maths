<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Pub Quiz Team Name Generator advert</title>
  <desc id="desc">Bright purple and orange pub quiz banner promoting the Pub Quiz Team Name Generator.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#32105f"/>
      <stop offset="0.55" stop-color="#6513a2"/>
      <stop offset="1" stop-color="#b2147c"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffb000"/><stop offset="1" stop-color="#ff6a00"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#190028" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="500" rx="28" fill="url(#bg)"/>
  <g fill="#ffd234" opacity=".9"><circle cx="86" cy="70" r="8"/><circle cx="178" cy="38" r="5"/><circle cx="312" cy="84" r="6"/><circle cx="1088" cy="54" r="7"/></g>
  <path d="M0 450C260 330 430 520 710 382s342-80 490-210v328H0z" fill="#25104d" opacity=".72"/>
  <g transform="translate(60 55)" font-family="Arial, Helvetica, sans-serif">
