    <rect x="0" y="82" width="520" height="78" rx="14" fill="#42105f" stroke="#ff9e00" stroke-width="4"/>
    <text x="24" y="136" fill="#fff" font-size="48" font-weight="900">TEAM NAME</text>
    <text x="0" y="207" fill="#ffb400" font-size="38" font-weight="900">GENERATOR</text>
    <text x="0" y="271" fill="#fff" font-size="34" font-weight="800">Need a brilliant pub quiz</text>
    <text x="0" y="312" fill="#ffd234" font-size="40" font-weight="900">team name?</text>
    <text x="0" y="354" fill="#f1ddff" font-size="22">Generate funny, clever and memorable names in seconds.</text>
    <g transform="translate(0 383)">
      <rect width="325" height="72" rx="20" fill="url(#orange)" filter="url(#shadow)"/>
      <text x="38" y="48" fill="#fff" font-size="31" font-weight="900">Try it now →</text>
    </g>
  </g>

  <g transform="translate(760 62)" filter="url(#shadow)">
